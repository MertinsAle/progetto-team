
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pizzeria</title>
</head>
<body>
    <header>
        <h1>Grande Piramide di Egitto</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Contatti</a>
        </nav>

    
    </header>

    <div class="Servizi">
        <label>Scegli il cibo:</label>

        <select name="cibo">
            <option>Pizza</option>
            <option>Hamburger</option>
            <option>Panino</option>
            <option>Patatine</option>
        </select>

        <br><br>

        <label>Quantità:</label>
        <input type="number" name="quantita" min="1" value="1">

        <br><br>

        <button type="submit">Aggiungi</button>
    </div>

    <hr>

    <h2>Scontrino</h2>

    <p>Pizza ............ €7,00</p>
    <p>Hamburger .... €8,00</p>
    <p>Patatine ........ €3,00</p>

    <hr>

    <h3>Totale: €18,00</h3>

    <button type="button" onclick="this.textContent='Prenotazione effettuata!'">
        Prenota
    </button>

</body>
</html>
